# Ruff configuration for FusionToGitHub.
#
# CI pins ruff to an exact version (.github/workflows/ci.yml) so that a new
# ruff release cannot silently change the enforced rule set — ruff 0.16
# broadened its *default* selection, which turned this job red with no code
# change. This file makes the rule set explicit and stable.
#
# `select` is ruff's historical stable default: real bugs only (pyflakes plus
# the error-level pycodestyle checks). The source is clean under this set.
# Adopting the broader modernization rules ruff now defaults to (pyupgrade,
# bugbear, import sorting, bandit, logging-format, …) is worthwhile but is a
# separate, reviewed change: several touch exception-handling and typing
# patterns that need per-case judgement in Fusion add-in code, and ruff's
# bundled isort needs tuning before it will reformat this repo's dual
# import-fallback blocks sensibly.

target-version = "py310"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
