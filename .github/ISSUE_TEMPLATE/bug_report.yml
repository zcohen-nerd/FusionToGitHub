name: Bug report
description: Something doesn't work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [troubleshooting guide](https://github.com/zcohen-nerd/FusionToGitHub/blob/main/docs/TROUBLESHOOTING.md) and run **Check My Setup…** in the dialog first.
        **Security problem?** Don't describe it here: see [SECURITY.md](https://github.com/zcohen-nerd/FusionToGitHub/blob/main/SECURITY.md#reporting-a-problem).
  - type: input
    id: addin-version
    attributes:
      label: Add-in version
      description: Shown in the log's "Add-In Loaded and running" line, or the release you installed.
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: fusion-version
    attributes:
      label: Fusion version
      description: Help → About in Fusion.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Check My Setup shows it, or run `git --version`.
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Release ZIP
        - Community Store
        - Other / not sure
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste the full message, including its Technical details.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Help & Privacy → Open Log File… The log contains no tokens or passwords, but does contain folder paths, repository addresses and design names; remove anything private.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed tokens, passwords and anything private (repository and design names, file paths) from this report.
          required: true
