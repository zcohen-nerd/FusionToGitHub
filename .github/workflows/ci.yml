name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff==0.16.5

      - name: Run ruff check
        run: ruff check src/ tests/ --output-format=github

  docs:
    name: Docs Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Verifies documentation links/anchors resolve; does not enforce prose style.
      - name: Link, anchor, and image check
        run: node .github/scripts/check-docs.mjs

      - name: Guard against non-rendering blob image embeds
        run: |
          if grep -rEn '!\[[^]]*\]\(https://github\.com/[^)]*/blob/' --include='*.md' .; then
            echo "::error::Image embed uses a github.com blob URL; use a relative path."
            exit 1
          fi
          echo "No blob image embeds."

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python tests/test_runner.py
