name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  # The release workflow runs this whole file on the tagged commit before it
  # builds anything, so a release can never skip the tests.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install linter
        run: pip install ruff==0.16.5

      - name: Run ruff check
        run: ruff check src/ tests/ scripts/ --output-format=github

  docs:
    name: Docs Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      # Verifies documentation links/anchors resolve; does not enforce prose style.
      - name: Link, anchor, and image check
        run: node .github/scripts/check-docs.mjs

      - name: Guard against non-rendering blob image embeds
        run: |
          if grep -rEn '!\[[^]]*\]\(https://github\.com/[^)]*/blob/' --include='*.md' .; then
            echo "::error::Image embed uses a github.com blob URL; use a relative path."
            exit 1
          fi
          echo "No blob image embeds."

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      # Lets the Windows jobs exercise the real Credential Manager (ephemeral
      # runner); never set this on a developer machine.
      FTG_REAL_VAULT_TESTS: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # macOS is Experimental (decision Q5): the Git pipeline tests still
          # run there, but nothing is tested inside Fusion on a Mac.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run regression tests
        run: python tests/test_runner.py

      - name: Run unit tests (including the dialog, against simulated Fusion)
        run: python -m unittest discover -s tests/unit -v

  unusual-git-config:
    name: Unusual Git config (${{ matrix.os }})
    # The suites must pass with a global Git config full of non-default
    # settings real users have (tests/hostile.gitconfig), and must not leave
    # temporary folders behind.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GIT_CONFIG_GLOBAL: ${{ github.workspace }}/tests/hostile.gitconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Record existing temp folders
        run: python scripts/tempdir_guard.py snapshot "${{ runner.temp }}/tempdirs.json"

      - name: Run regression tests
        run: python tests/test_runner.py

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit

      - name: Check no temp folders were left behind
        run: python scripts/tempdir_guard.py check "${{ runner.temp }}/tempdirs.json"

  coverage:
    name: Coverage
    # Windows, because it is the supported platform and the only one where
    # the Credential Manager code runs. Per-module thresholds live in
    # scripts/coverage_gate.py.
    runs-on: windows-latest
    env:
      FTG_REAL_VAULT_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install coverage==7.16.0

      - name: Measure both suites
        run: |
          python -m coverage run --branch --parallel-mode --source=src -m unittest discover -s tests/unit
          python -m coverage run --branch --parallel-mode --source=src tests/test_runner.py
          python -m coverage combine
          python -m coverage report --skip-empty
          python -m coverage json -o coverage.json

      - name: Enforce per-module thresholds and assertion checks
        run: python scripts/coverage_gate.py coverage.json

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: python scripts/check_release.py

      - name: Build and validate the add-in ZIP
        run: python scripts/package.py build --out dist

      # A test build of every change, for trying in Fusion before release.
      # This is not a release: nothing is published.
      - name: Upload test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Push_To_GitHub-test-build
          path: dist/
          retention-days: 14
          if-no-files-found: error
