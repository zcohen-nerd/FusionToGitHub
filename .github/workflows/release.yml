name: Release

# Pushing a version tag (for example 0.3.3) runs the full CI on that commit,
# checks that the tag matches the manifest and is on main, builds the ZIP,
# attests it, and creates a DRAFT release with the ZIP attached.
# A maintainer then installs the drafted ZIP in Fusion and clicks Publish.
# Nothing is ever published automatically. See CONTRIBUTING.md, "Releasing".
#
# Running it by hand ("Run workflow") is a dry run on the chosen branch or
# tag: it builds and uploads the ZIP as a workflow artifact and creates no
# release.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build package
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check_release needs origin/main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check the release
        env:
          IS_TAG: ${{ github.ref_type == 'tag' }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            python scripts/check_release.py --tag "$TAG" --require-on-main --write-notes release-notes.md
          else
            python scripts/check_release.py --write-notes release-notes.md
          fi

      - name: Read version
        id: version
        run: |
          echo "version=$(python -c 'import json; print(json.load(open("src/Push_To_GitHub.manifest"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build and validate the add-in ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/package.py build --out dist --expect-version "$VERSION"

      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  draft-release:
    name: Create draft release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package

      - name: Create the draft release with the ZIP attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ZIP="dist/Push_To_GitHub-${VERSION}.zip"
          {
            cat release-notes.md
            echo
            echo "---"
            echo
            echo "**Install:** download \`Push_To_GitHub-${VERSION}.zip\` and unzip it into Fusion's AddIns folder,"
            echo "so that you get \`AddIns/Push_To_GitHub/Push_To_GitHub.manifest\`. See the README for the full steps."
            echo
            echo "**Verify the download:** \`gh attestation verify Push_To_GitHub-${VERSION}.zip -R ${GH_REPO}\`"
            echo "or compare its SHA-256 with \`Push_To_GitHub-${VERSION}.zip.sha256\`."
          } > body.md
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --draft --verify-tag --title "$TAG" --notes-file body.md
          echo "Draft release $TAG created. Install the ZIP in Fusion, then publish it on GitHub." >> "$GITHUB_STEP_SUMMARY"
